  :root{
    --paper:#f7f1e5; --paper2:#efe5d2; --card:#fffcf5; --ink:#241c16; --muted:#80705f; --line:#e6dac6;
    --la:#a3352a; --gr:#1e5b7d; --accent:var(--la);
    --ok:#2f7d4f; --ko:#b8392c; --gold:#c08a2b;
    --serif:"Gentium Book Plus","PalaestraSerif",Georgia,serif;
    --shadow:0 1px 2px rgba(60,40,20,.06),0 8px 24px rgba(60,40,20,.08);
  }
  body[data-lang="gr"]{--accent:var(--gr)}
  @media (prefers-color-scheme: dark){
    :root{--paper:#191512; --paper2:#251f1a; --card:#211b17; --ink:#f1e8da; --muted:#a8998a; --line:#3a3029;
      --la:#e07a5f; --gr:#6fb1d4; --ok:#6cc58f; --ko:#ef7a6d; --gold:#e3b252;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;
    background-image:radial-gradient(circle at 15% 0%, color-mix(in srgb,var(--accent) 10%,transparent), transparent 45%);
    background-attachment:fixed;transition:background-color .3s}
  .serif,.big,.mid,.form,td.f,.kb button,h1,.motto{font-family:var(--serif)}
  button{font-family:inherit}

/* Confronto risposte: tollerante (ignora accenti/quantità) o rigoroso */
function norm(s){
  s = s.normalize("NFD").toLowerCase().trim().replace(/\s+/g," ");
  if(!S.strict) s = s.replace(/[̀-ͯ]/g,"");
  return s.replace(/ς/g,"σ").replace(/[’'.,;]/g,"").normalize("NFC");
}
function variants(form){
  let out=[];
  form.split("/").map(x=>x.trim()).forEach(x=>{
    if(x.includes("(ν)")) out.push(x.replace("(ν)",""), x.replace("(ν)","ν")); else out.push(x);
  });
  return out;
}
const matches = (input, form) => variants(form).some(v => norm(v)===norm(input));

const LAT2GR = {a:"α",b:"β",g:"γ",d:"δ",e:"ε",z:"ζ",h:"η",q:"θ",i:"ι",k:"κ",l:"λ",m:"μ",n:"ν",
  c:"ξ",o:"ο",p:"π",r:"ρ",s:"σ",t:"τ",u:"υ",f:"φ",x:"χ",y:"ψ",w:"ω",j:"ς"};
const DIA = [["́","acuto ´"],["̀","grave `"],["͂","circonfl. ῀"],
             ["̓","spirito dolce ᾿"],["̔","spirito aspro ῾"],["ͅ","iota sottoscritto"]];

function greekInput(inp){
  inp.addEventListener("input", ()=>{
    const pos = inp.selectionStart;
    const v = inp.value.replace(/[a-z]/gi, ch => {
      const g = LAT2GR[ch.toLowerCase()]; if(!g) return ch;
      return ch===ch.toUpperCase() ? g.toUpperCase() : g;
    });
    if(v!==inp.value){ inp.value=v; inp.setSelectionRange(pos,pos); }
  });
  const kb = document.createElement("div"); kb.className="kb";
  "αβγδεζηθικλμνξοπρστυφχψως".split("").forEach(ch=>kb.appendChild(key(ch,ch)));
  DIA.forEach(([c,l])=>{const b=key(c,l);b.classList.add("dia");kb.appendChild(b)});
  const bs=key(null,"⌫");bs.classList.add("dia");kb.appendChild(bs);
  function key(ins,label){
    const b=document.createElement("button");b.type="button";b.textContent=label;
    b.onclick=()=>{
      if(ins===null) inp.value=[...inp.value.normalize("NFD")].slice(0,-1).join("").normalize("NFC");
      else inp.value=(inp.value.normalize("NFD")+ins).normalize("NFC");
      inp.focus();
    };
    return b;
  }
  inp.after(kb);
  const tip=document.createElement("div");tip.className="hint";tip.style.marginTop="6px";
  tip.textContent="Puoi scrivere con la tastiera normale: le lettere latine diventano greche (q=θ, c=ξ, h=η, x=χ, y=ψ, w=ω, j=ς).";
  kb.after(tip);
}

/* --- Alfabeto: quiz a scelta multipla --- */
function viewAlpha(){
  const mode = pick(["nome","lettera"]);
  const L = pick(ALPHA);
  const others = shuffle(ALPHA.filter(x=>x!==L)).slice(0,3);
  const opts = shuffle([L,...others]);
  const q = mode==="nome"
    ? `<div class="lbl">Come si chiama questa lettera?</div><div class="big">${L[0]} ${L[1]}</div>`
    : `<div class="lbl">Quale lettera è…</div><div class="big serif" style="font-size:34px">${L[2]}</div>`;
  $("#view").innerHTML = `<div class="card">${q}
    <div class="opts">${opts.map((o,i)=>`<button class="btn ${mode==="lettera"?"serif":""}" data-i="${i}">${mode==="nome"?o[2]:o[0]+" "+o[1]}</button>`).join("")}</div>
    <div class="fb" id="fb"></div>
    <div class="row"><button class="btn pri" id="next">Avanti →</button></div></div>`;
  let done=false;
  document.querySelectorAll(".opts .btn").forEach(b=>b.onclick=()=>{
    if(done) return; done=true;
    const good = opts[+b.dataset.i]===L; score(good);
    document.querySelectorAll(".opts .btn").forEach(x=>{if(opts[+x.dataset.i]===L)x.classList.add("right")});
    if(!good) b.classList.add("wrong");
    $("#fb").className="fb "+(good?"ok":"ko");
    $("#fb").textContent=`${L[0]} ${L[1]} = ${L[2]}, si traslittera «${L[3]}».`;
  });
  $("#next").onclick=viewAlpha;
}

/* --- Lessico: flashcard con scatole di Leitner --- */
function viewVoc(){
  const deck = VOC[S.lang];
  const key = "pal-box-"+S.lang;
  const boxes = store.get(key,{});
  const box = w => boxes[w]||0;
  // le parole nelle scatole basse escono più spesso
  const weights = deck.map(c=>1/Math.pow(2,box(c[0])));
  let r=Math.random()*weights.reduce((a,b)=>a+b,0), i=0;
  while(r>weights[i]){r-=weights[i];i++}
  const card = deck[i];
  const rev = store.get("pal-rev",false);
  const front = rev ? card[1].replace(/\//g," / ") : card[0];
  const back  = rev ? card[0] : card[1].replace(/\//g," / ");
  const counts=[0,0,0,0,0];deck.forEach(c=>counts[Math.min(box(c[0]),4)]++);
  $("#view").innerHTML = `<div class="card">
    <div class="bar" style="margin:0"><div class="lbl">Flashcard · ${S.lang==="la"?"latino":"greco"}</div>
      <label class="chk"><input type="checkbox" id="rev" ${rev?"checked":""}> Dall'italiano</label></div>
    <div class="flip" id="flash"><div class="flip-in">
      <div class="face front"><div class="big" style="font-size:36px">${front}</div>
        <div class="hint" style="margin-top:12px">Tocca la carta (o premi spazio) per girarla</div></div>
      <div class="face back"><div class="mid" style="font-size:28px">${back}</div>
        <div class="hint serif" style="margin-top:10px;font-size:16px">${front}</div></div>
    </div></div>
    <div class="row hidden" id="judge" style="justify-content:center">
      <button class="btn ko" id="no">Non la sapevo</button><button class="btn ok" id="yes">La sapevo</button>
    </div>
    <div class="boxes">${counts.map((n,j)=>`<span>Scatola ${j+1}${j===4?"+":""}: ${n}</span>`).join("")}</div>
    <div class="hint" style="margin-top:6px">Le parole che sai salgono di scatola e tornano più di rado; quelle che sbagli ripartono dalla prima.</div>
  </div>`;
  const flip=()=>{$("#flash").classList.add("on");$("#judge").classList.remove("hidden")};
  $("#flash").onclick=flip;
  $("#rev").onchange=e=>{store.set("pal-rev",e.target.checked);viewVoc()};
  const judge=good=>{score(good);boxes[card[0]]=good?box(card[0])+1:0;store.set(key,boxes);viewVoc()};
  $("#yes").onclick=()=>judge(true); $("#no").onclick=()=>judge(false);
  document.onkeydown=e=>{
    if(S.tab!=="voc"||e.target.tagName==="INPUT")return;
    if(e.code==="Space"){e.preventDefault();flip()}
    else if(!$("#judge").classList.contains("hidden")){if(e.key==="1")judge(false);if(e.key==="2")judge(true)}
  };
}

/* --- Esercizio a risposta scritta (declinazioni e verbi) --- */
function selector(list, key, again){
  const v = S.filt[key];
  return {html:`<select id="filt" style="width:100%;margin-bottom:14px">
      <option value="all">Tutti i paradigmi (misti)</option>
      ${list.map((p,i)=>`<option value="${i}" ${String(i)===String(v)?"selected":""}>${p.name}</option>`).join("")}
    </select>`,
    bind(){ $("#filt").onchange=e=>{S.filt[key]=e.target.value;again()} }};
}
function drill(title, prompt, answer, tableHtml, again, sel){
  $("#view").innerHTML = `<div class="card">
    ${sel?sel.html:""}
    <div class="lbl">${title}</div>
    <div class="mid serif" style="margin-top:8px">${prompt}</div>
    <form id="f" autocomplete="off"><input class="ans" id="ans" spellcheck="false" autocapitalize="off" placeholder="Scrivi la forma…"></form>
    <div class="fb" id="fb"></div>
    <div class="row"><button class="btn pri" id="go">Verifica</button>
      <button class="btn" id="skip">Mostra soluzione</button>
      <button class="btn" id="tbl">Tabella</button></div>
    <div id="table" class="hidden">${tableHtml}</div>
  </div>`;
  if(sel) sel.bind();
  const inp=$("#ans"); if(S.lang==="gr") greekInput(inp);
  inp.focus();
  let done=false;
  const finish=(good,shown)=>{
    done=true; if(!shown) score(good); else score(false);
    $("#fb").className="fb "+(good?"ok":"ko");
    $("#fb").innerHTML=(good?"✓ Esatto: ":"✗ La forma giusta è ")+`<span class="serif" style="font-size:22px">${answer}</span>`;
    $("#go").textContent="Avanti →"; $("#table").classList.remove("hidden");
  };
  $("#f").onsubmit=e=>{e.preventDefault(); if(done) return again(); if(!inp.value.trim()) return; finish(matches(inp.value,answer))};
  $("#go").onclick=()=>$("#f").requestSubmit();
  $("#skip").onclick=()=>{if(!done)finish(false,true)};
  $("#tbl").onclick=()=>$("#table").classList.toggle("hidden");
}

function declTable(p, lang, hi){
  const C=CASES[lang];
  return `<table><tr><th>${p.name}</th><th>singolare</th><th>plurale</th></tr>
    ${C.map((c,i)=>`<tr><th>${c}</th><td class="f ${hi&&hi[0]==="sg"&&hi[1]===i?"hl":""}">${p.sg[i]}</td><td class="f ${hi&&hi[0]==="pl"&&hi[1]===i?"hl":""}">${p.pl[i]}</td></tr>`).join("")}</table>`;
}
function verbTable(v, hi){
  return `<table><tr><th colspan="2">${v.name}</th></tr>${PERS.map((p,i)=>`<tr><th>${p}</th><td class="f ${hi===i?"hl":""}">${v.f[i]}</td></tr>`).join("")}</table>`;
}

const nouns = () => [...DECL[S.lang], ...PRON[S.lang]];
function viewDecl(){
  const list=nouns(), f=S.filt.decl;
  const p = f==="all" ? pick(list) : list[+f];
  let c,n; do{ c=rnd(CASES[S.lang].length); n=pick(["sg","pl"]); }while(p[n][c]==="—");
  const lemma=p.name.split("·")[1].trim();
  drill(p.name.split("·")[0].trim(),
    `<b>${lemma}</b><br><span class="hint" style="font-size:17px">${CASES[S.lang][c]} ${n==="sg"?"singolare":"plurale"}</span>`,
    p[n][c], declTable(p,S.lang,[n,c]), viewDecl, selector(list,"decl",viewDecl));
}
function viewVerb(){
  const list=VERB[S.lang], f=S.filt.verb;
  const v = f==="all" ? pick(list) : list[+f], i=rnd(6);
  const [lemma,tense]=v.name.split("·").map(s=>s.trim());
  drill(tense, `<b>${lemma}</b><br><span class="hint" style="font-size:17px">${PERS[i]}</span>`,
    v.f[i], verbTable(v,i), viewVerb, selector(list,"verb",viewVerb));
}

/* --- Riconosci la forma: dalla forma all'analisi (come nelle versioni) --- */
function allForms(){
  const out=[], L=S.lang;
  nouns().forEach(p=>{
    const lemma=p.name.split("·")[1].trim();
    ["sg","pl"].forEach(n=>p[n].forEach((f,c)=>{
      if(f!=="—") out.push({group:lemma, form:f, an:`${CASES[L][c]} ${n==="sg"?"singolare":"plurale"}`, p, hi:[n,c], kind:"n"});
    }));
  });
  VERB[L].forEach(v=>{
    const [lemma,tense]=v.name.split("·").map(s=>s.trim());
    v.f.forEach((f,i)=>out.push({group:lemma, form:f, an:`${tense.replace(/\s*\(.*\)/,"")}, ${PERS[i]}`, v, hi:i, kind:"v"}));
  });
  return out;
}
function viewRec(){
  const all=allForms();
  const q=pick(all);
  const shown=pick(variants(q.form));
  const same=all.filter(x=>x.group===q.group);
  const strictEq=(a,b)=>a.normalize("NFC")===b.normalize("NFC");
  const isRight=x=>variants(x.form).some(v=>strictEq(v,shown));
  const rightAns=[...new Set(same.filter(isRight).map(x=>x.an))];
  const wrongAns=shuffle([...new Set(same.filter(x=>!isRight(x)).map(x=>x.an))]).filter(a=>!rightAns.includes(a)).slice(0,3);
  const opts=shuffle([q.an,...wrongAns]);
  const lemmaTxt = q.kind==="n" ? q.p.name.split("·")[1].trim() : q.group;
  $("#view").innerHTML=`<div class="card">
    <div class="lbl">Riconosci la forma · ${S.lang==="la"?"latino":"greco"}</div>
    <div class="big">${shown}</div>
    <div class="hint">da <span class="serif" style="font-size:17px">${lemmaTxt}</span>: che forma è?</div>
    <div class="opts">${opts.map((o,i)=>`<button class="btn" data-i="${i}" style="font-size:15px">${o}</button>`).join("")}</div>
    <div class="fb" id="fb"></div>
    <div class="row"><button class="btn pri" id="next">Avanti →</button></div>
    <div id="table" class="hidden">${q.kind==="n"?declTable(q.p,S.lang,q.hi):verbTable(q.v,q.hi)}</div>
  </div>`;
  let done=false;
  document.querySelectorAll(".opts .btn").forEach(b=>b.onclick=()=>{
    if(done) return; done=true;
    const good=rightAns.includes(opts[+b.dataset.i]); score(good);
    document.querySelectorAll(".opts .btn").forEach(x=>{if(rightAns.includes(opts[+x.dataset.i]))x.classList.add("right")});
    if(!good) b.classList.add("wrong");
    $("#fb").className="fb "+(good?"ok":"ko");
    $("#fb").innerHTML = (good?"✓ Giusto. ":"✗ Era: ")+rightAns.join(" <b>oppure</b> ")+
      (rightAns.length>1?`<div class="hint" style="margin-top:4px">Attenzione: questa forma è ambigua, nella versione decide il contesto.</div>`:"");
    $("#table").classList.remove("hidden");
  });
  $("#next").onclick=viewRec;
}

/* --- Tabelle di consultazione --- */
function viewTables(){
  const L=S.lang;
  $("#view").innerHTML = `<div class="card">
    <div class="lbl">Declinazioni · ${L==="la"?"latino":"greco"}</div>
    ${DECL[L].map(p=>declTable(p,L)).join("")}
  </div><div class="card">
    <div class="lbl">${L==="la"?"Pronomi":"Articolo e pronomi"}</div>
    ${PRON[L].map(p=>declTable(p,L)).join("")}
  </div><div class="card">
    <div class="lbl">Verbi · ${L==="la"?"latino":"greco"}</div>
    ${VERB[L].map(v=>verbTable(v)).join("")}
  </div>
  ${L==="gr"?`<div class="card"><div class="lbl">Alfabeto greco</div><table>
    <tr><th>Lettera</th><th>Nome</th><th>Traslitterazione</th></tr>
    ${ALPHA.map(a=>`<tr><td class="f">${a[0]} ${a[1]}</td><td>${a[2]}</td><td>${a[3]}</td></tr>`).join("")}</table></div>`:""}`;
}

/* ===================== EVENTI ===================== */
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(b){S.tab=b.dataset.t;render()}};
$("#lang").onclick=e=>{const b=e.target.closest("button"),l=b&&b.dataset.l;if(l){S.lang=l;S.filt={decl:"all",verb:"all"};render()}};
$("#strict").onchange=e=>{S.strict=e.target.checked;store.set("pal-strict",S.strict)};
render();
</script>
